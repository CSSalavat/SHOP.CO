<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SHOP.CO</title>
    <link rel="stylesheet" href="/styles/style.css" />
    <link
      rel="shortcut icon"
      href="/img/Logo__Favicon.svg"
      type="image/x-icon"
    />
  </head>
  <body>
    <div class="top-banner">
      <span>Sign up and 20% off to your first order.</span>
      <a href="#">Sign Up Now</a>
      <button class="btn">&times;</button>
    </div>

    <header class="header-container">
      <nav class="navbar">
        <a href="#" class="logo">
          <img src="/img/Logo__Header.svg" alt="SHOP.CO" />
        </a>

        <ul class="nav-links">
          <li><a href="#">Shop</a></li>
          <li><a href="#">On Sale</a></li>
          <li><a href="#">New Arrivals</a></li>
          <li><a href="#">Brands</a></li>
        </ul>

        <div class="search-bar">
          <img src="/img/Search.svg" alt="Search" />
        </div>

        <div class="nav-icons">
          <a href="#"><img src="/img/Vector.svg" alt="button" /></a>
          <a href="#"><img src="/img/Vector2.svg" alt="button" /></a>
        </div>
      </nav>
    </header>
  </body>
</html>
